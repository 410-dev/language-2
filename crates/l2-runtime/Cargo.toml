[package]
name = "l2-runtime"
version.workspace = true
edition.workspace = true
description = "Shared runtime value model and builtins for language-2 (interpreter, VM, native)"

[dependencies]
libm = "0.2"
regex = "1"
regex-syntax = "0.8"
fancy-regex = "0.19"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
md-5 = "0.10"
digest = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
getrandom = "0.2"
jiff = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
